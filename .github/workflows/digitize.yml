name: Digitize BMBA mocks

on:
  workflow_dispatch: {}

concurrency:
  group: bmba-pipeline-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digitize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Digitize all PDFs in moks/
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m bmba_pipeline.cli digitize-batch moks/ --export --skip-existing

      - name: Commit updated database and exports
        run: |
          git config user.name "bmba-bot"
          git config user.email "bmba-bot@users.noreply.github.com"
          git add data/problems.db output/
          git diff --cached --quiet && echo "Нет изменений для коммита" && exit 0
          git commit -m "Оцифровка: обновлена база задач [skip ci]"
          git push
